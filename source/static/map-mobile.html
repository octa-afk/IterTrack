<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dbe7f8">
<title>IterTrack · móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--road:#fff;--roadb:#dde4f0;--park:#e1eee6;--water:#cddff4;--glass:rgba(255,255,255,.72);--g-bd:rgba(255,255,255,.8);--g-hi:inset 0 1px 0 rgba(255,255,255,.9);--g-sh:0 12px 39px rgba(25,45,95,.16);--blur:blur(28px) saturate(180%);--card:rgba(255,255,255,.8);--ink:#1f2a3d;--muted:#6b778c;--fill:rgba(31,42,61,.06);--fill2:rgba(31,42,61,.11);--sel:rgba(31,42,61,.09);--ac:#5a7ee6;--acd:#4666cc;--mv:#5a7ee6;--id:#eeb04a;--st:#8a949c;--al:#e0675c;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;font:14px/1.4 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(644px 460px at 5% 6%,rgba(120,165,240,.38),transparent 100%),radial-gradient(713px 483px at 78% -6%,rgba(165,210,245,.55),transparent 70%),radial-gradient(598px 483px at 10% 100%,rgba(185,180,240,.28),transparent 70%),linear-gradient(135deg,#dbe7f8,#cbdcf3)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
svg{display:block}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(16px + var(--safe-t)) 16px calc(104px + var(--safe-b));display:none}
body[data-tab=home] #home,body[data-tab=fleet] #fleet{display:block}
#mapscreen{position:absolute;inset:0;display:none}
body[data-tab=map] #mapscreen{display:block}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px}
.brand svg{width:32px;height:32px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
h1{font-size:22px;font-weight:600;line-height:1.2}
.sub{color:var(--muted);font-size:13px;margin:2px 0 16px;display:flex;align-items:center;gap:7px}
.live{width:8px;height:8px;border-radius:50%;background:var(--mv);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.card{background:var(--card);border:1px solid var(--g-bd);box-shadow:var(--g-hi),0 3.5px 16px rgba(60,90,150,.08);border-radius:22px;padding:16px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.sec h2{font-size:15px;font-weight:600}
.tag{background:var(--fill2);border-radius:12px;font-size:12px;padding:3px 11px;font-weight:500}
.tag.red{background:var(--al);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--g-bd);box-shadow:var(--g-hi),0 3.5px 16px rgba(60,90,150,.08);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;min-height:76px}
.tile:active{background:#fff}
.tile i{width:12px;height:12px;border-radius:50%;background:var(--c);grid-row:span 2}
.tile b{font-size:26px;font-weight:600;line-height:1.1}
.tile span{color:var(--muted);font-size:12px;grid-column:2}
.al{display:grid;grid-template-columns:42px 1fr auto;gap:2px 12px;align-items:center;width:100%;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--g-bd);box-shadow:var(--g-hi),0 3.5px 16px rgba(60,90,150,.08);margin-bottom:8px}
.al:active{background:#fff}
.al .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;grid-row:span 3;color:var(--c);background:color-mix(in srgb,var(--c) 15%,#fff)}
.al .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.al b{font-size:14px;font-weight:600}
.al small{color:var(--muted);font-size:12px;grid-column:2}
.al em{font-style:normal;font-size:13px;font-weight:500;color:var(--c);grid-column:2}
.al .ago{grid-column:3;grid-row:1;font-size:11px;color:var(--muted);white-space:nowrap}
.ok{display:flex;align-items:center;gap:12px;color:var(--muted)}
.ok svg{width:34px;height:34px;color:var(--mv);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ok b{display:block;color:var(--ink);font-weight:600}
.bars{position:relative;display:flex;align-items:flex-end;gap:7px;height:150px;margin-top:6px}
.bars .lim{position:absolute;left:0;right:0;border-top:1.5px dashed var(--id);pointer-events:none}
.bars .lim span{position:absolute;right:0;top:-17px;font-size:10px;color:var(--id)}
.bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bar i{width:100%;max-width:30px;border-radius:5px 5px 0 0;background:rgba(90,126,230,.3);transition:height .4s}
.bar.over i{background:var(--al)}
.bar b{font-size:10px;font-weight:500;color:var(--muted);margin-top:5px;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:23px;background:var(--card);border:1px solid var(--g-bd);padding:0 16px;margin:14px 0 10px}
.search:focus-within{box-shadow:0 0 0 2px var(--ac)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.search svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:22px;padding:3.5px;margin-bottom:10px}
.seg button{min-height:40px;border-radius:20px;font-weight:500;text-align:center}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(25,45,95,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 15px;border-radius:19px;background:rgba(31,42,61,.06);font-size:13px}
.chip[aria-pressed=true]{background:rgba(31,42,61,.14);font-weight:600}
#count{font-size:12px;color:var(--muted);margin:0 4px 6px}
#list{list-style:none;padding:6px}
#list li[hidden]{display:none}
#list button{width:100%;min-height:62px;padding:10px 12px;border-radius:14px;display:grid;grid-template-columns:12px 1fr auto;gap:1px 12px;align-items:center}
#list button:active{background:var(--sel)}
.dot{width:12px;height:12px;border-radius:50%;grid-row:span 2;background:var(--c)}
.nm{font-weight:600}
.sp{font-weight:600;font-size:15px;color:var(--ac);text-align:right}
.sp small,.sb,.fu{font-size:12px;color:var(--muted);font-weight:400}
.sb{grid-column:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu{grid-column:3;text-align:right}
.fu.low{color:var(--al);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted)}
#tabs{position:fixed;z-index:10;left:14px;right:14px;bottom:calc(10px + var(--safe-b));height:66px;border-radius:33px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--g-bd);box-shadow:var(--g-hi),var(--g-sh);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px}
#tabs button{border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:500;color:#3b4862;position:relative;text-align:center}
#tabs button[aria-selected=true]{background:var(--sel);color:var(--ink);font-weight:600}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--al);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 5px}
#tabs .badge[hidden]{display:none}
#map{position:absolute;inset:0;touch-action:none;overflow:hidden;cursor:grab;background:var(--bg)}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.pin{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px var(--c),0 2px 8px rgba(0,0,0,.35);will-change:transform}
.pin svg{width:100%;height:100%;pointer-events:none}
.pin.sel{z-index:5;width:48px;height:48px;margin:-4px 0 0 -4px}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--g-bd);box-shadow:var(--g-hi),var(--g-sh)}
.maptop{position:absolute;z-index:3;left:12px;top:calc(12px + var(--safe-t));height:46px;border-radius:23px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:600}
.zoom{position:absolute;z-index:3;right:12px;top:calc(12px + var(--safe-t));border-radius:18px;overflow:hidden}
.zoom button{display:block;width:44px;height:44px;font-size:22px;text-align:center}
.zoom button+button{border-top:1px solid rgba(31,42,61,.1)}
#mini{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(88px + var(--safe-b));border-radius:24px;padding:14px 16px}
#mini[hidden]{display:none}
#mini .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
#mini .r b{font-size:16px}
#mini .m{display:flex;gap:18px;margin:8px 0 12px;color:var(--muted);font-size:12px}
#mini .m b{display:block;color:var(--ac);font-size:18px;font-weight:600}
.btn{display:block;width:100%;min-height:46px;border-radius:23px;background:var(--ac);color:#fff;font-weight:600;text-align:center}
.btn.soft{background:var(--fill2);color:var(--ink);font-weight:500}
#detail{position:fixed;z-index:30;inset:0;overflow-y:auto;padding:calc(12px + var(--safe-t)) 16px calc(24px + var(--safe-b));background:radial-gradient(644px 460px at 5% 6%,rgba(120,165,240,.38),transparent 100%),linear-gradient(135deg,#dbe7f8,#cbdcf3);transform:translateX(104%);visibility:hidden;transition:transform .3s cubic-bezier(.4,0,.2,1),visibility 0s .3s}
body.dopen #detail{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.4,0,.2,1),visibility 0s}
.dhd{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dhd b{font-size:18px;font-weight:600;display:block;line-height:1.2}
.dhd small{color:var(--muted)}
.hero{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.hero b{font-size:42px;font-weight:600;color:var(--ac);line-height:1}
.hero small{color:var(--muted);font-size:13px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:14px;background:#fff;border-radius:14px;padding:12px 4px}
.st3 b{display:block;font-size:19px;font-weight:600;color:var(--ac)}
.st3 span{font-size:11px;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
dt{color:var(--muted)}dd{text-align:right;font-weight:500}
.spark{width:100%;height:80px;margin-top:8px}
.dal{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.dal i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
@media(prefers-reduced-motion:reduce){#detail,.live,.bar i{transition:none;animation:none}}
</style>
</head>
<body data-tab="home">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="trk" viewBox="0 0 512 512"><circle cx="256" cy="256" r="232" fill="#1F4E8C" stroke="#fff" stroke-width="24"/><g transform="translate(256 256) scale(.74) translate(-256 -258)"><g fill="#fff"><path d="M96 120Q96 38 170 34Q256 28 342 34Q416 38 416 120V300Q416 308 408 308H104Q96 308 96 300Z"/><rect x="92" y="310" width="328" height="142" rx="18"/><rect x="100" y="446" width="52" height="36" rx="9"/><rect x="360" y="446" width="52" height="36" rx="9"/></g><g fill="#fff" stroke="#1F4E8C" stroke-width="12" paint-order="stroke"><rect x="58" y="108" width="42" height="98" rx="16"/><rect x="412" y="108" width="42" height="98" rx="16"/></g><g fill="#1F4E8C"><rect x="106" y="90" width="300" height="120" rx="18"/><rect x="126" y="312" width="34" height="74" rx="7"/><rect x="352" y="312" width="34" height="74" rx="7"/><rect x="172" y="322" width="168" height="8" rx="4"/><rect x="172" y="340" width="168" height="8" rx="4"/><rect x="172" y="358" width="168" height="8" rx="4"/><rect x="172" y="376" width="168" height="8" rx="4"/></g></g></symbol>
</defs></svg>

<!-- PANEL (pantalla principal) -->
<section class="screen" id="home" aria-label="Panel">
  <div class="hd">
    <div class="brand"><svg viewBox="380 355 1210 1200" aria-hidden="true"><path fill="#5472d2" d="M390 752C385 590 500 465 665 465H1200L900 752Z"/><path fill="#3a58b4" d="M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1550 640 1440 750 1300 752H1240C1170 760 1125 810 1120 880V1250C1120 1420 1000 1540 860 1540Z"/><path fill="#6a8cee" d="M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1300 500 1000 640 880 860C770 1050 712 1250 710 1540Z"/></svg>IterTrack</div>
    <div class="avatar" aria-hidden="true">FL</div>
  </div>
  <h1>Resumen de flota</h1>
  <p class="sub"><i class="live"></i>En vivo · <span id="tot"></span> camiones</p>
  <div class="tiles" id="tiles">
    <button class="tile" data-s="move"><i style="--c:var(--mv)"></i><b id="nMove">0</b><span>En movimiento</span></button>
    <button class="tile" data-s="idle"><i style="--c:var(--id)"></i><b id="nIdle">0</b><span>Detenidos</span></button>
    <button class="tile" data-s="stop"><i style="--c:var(--st)"></i><b id="nStop">0</b><span>Apagados</span></button>
    <button class="tile" data-v="alert"><i style="--c:var(--al)"></i><b id="nAlert">0</b><span>Con alertas</span></button>
  </div>
  <div class="sec"><h2>Alertas activas</h2><span class="tag" id="alTag">0</span></div>
  <div id="alerts"></div>
  <div class="sec"><h2>Velocidad por camión</h2><span class="tag" id="avg"></span></div>
  <div class="card"><div class="bars" id="bars"></div></div>
</section>

<!-- CAMIONES -->
<section class="screen" id="fleet" aria-label="Camiones">
  <h1>Camiones</h1>
  <label class="search"><input id="q" type="search" placeholder="Buscar patente o chofer" aria-label="Buscar camiones"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></label>
  <div class="seg" id="seg">
    <button type="button" data-v="all" aria-pressed="true">Toda la flota</button>
    <button type="button" data-v="alert" aria-pressed="false">Solo alertas</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-s="all" aria-pressed="true">Todos</button>
    <button class="chip" data-s="move" aria-pressed="false">En movimiento</button>
    <button class="chip" data-s="idle" aria-pressed="false">Detenidos</button>
    <button class="chip" data-s="stop" aria-pressed="false">Apagados</button>
  </div>
  <div id="count"></div>
  <div class="card" style="padding:0"><ul id="list"></ul><div class="empty" id="empty" hidden>Ningún camión coincide con los filtros.</div></div>
</section>

<!-- MAPA (secundario) -->
<section id="mapscreen" aria-label="Mapa">
  <div id="map"><div id="world"></div></div>
  <div class="maptop glass"><i class="live"></i>Mapa en vivo</div>
  <div class="zoom glass"><button id="zi" aria-label="Acercar">+</button><button id="zo" aria-label="Alejar">−</button></div>
  <div id="mini" class="glass" hidden>
    <div class="r"><b id="mPlate"></b><span id="mSt" style="font-weight:600;font-size:13px"></span></div>
    <div class="m"><span><b id="mSp"></b>km/h</span><span><b id="mFu"></b>Combustible</span><span><b id="mDr"></b>Chofer</span></div>
    <button class="btn" id="mMore" type="button">Ver detalle</button>
  </div>
</section>

<nav id="tabs" role="tablist" aria-label="Principal">
  <button role="tab" data-t="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Panel<span class="badge" id="badge" hidden>0</span></button>
  <button role="tab" data-t="fleet" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>Camiones</button>
  <button role="tab" data-t="map" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Mapa</button>
</nav>

<!-- DETALLE -->
<section id="detail" inert aria-label="Detalle del camión">
  <div class="dhd"><button class="ib glass" id="dback" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div><b id="dPlate"></b><small id="dSub"></small></div></div>
  <div id="dbody"></div>
</section>

<script src="/static/js/map-mobile.js"></script>
</body>
</html>
