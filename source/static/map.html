<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IterTrack · Panel de seguimiento</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22380 355 1210 1200%22%3E%3Cpath fill=%22%235472d2%22 d=%22M390 752C385 590 500 465 665 465H1200L900 752Z%22/%3E%3Cpath fill=%22%233a58b4%22 d=%22M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1550 640 1440 750 1300 752H1240C1170 760 1125 810 1120 880V1250C1120 1420 1000 1540 860 1540Z%22/%3E%3Cpath fill=%22%236a8cee%22 d=%22M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1300 500 1000 640 880 860C770 1050 712 1250 710 1540Z%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/map.css">
</head>
<body>
<div class="app">
  <aside class="side" id="sidebar"><div class="side-in">
    <div class="logo">
      <svg class="mark" viewBox="380 355 1210 1200" role="img" aria-label="IterTrack"><path class="m3" d="M390 752C385 590 500 465 665 465H1200L900 752Z"/><path class="m2" d="M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1550 640 1440 750 1300 752H1240C1170 760 1125 810 1120 880V1250C1120 1420 1000 1540 860 1540Z"/><path class="m1" d="M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1300 500 1000 640 880 860C770 1050 712 1250 710 1540Z"/></svg>
      IterTrack
    </div>
    <nav aria-label="Principal">
      <a class="on" tabindex="0"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Panel</a>
      <a tabindex="0"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/></svg>Camiones</a>
      <a tabindex="0"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>Rutas</a>
      <a tabindex="0"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Reportes</a>
      <a tabindex="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4-2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.4-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.2-.8.2-1.2z"/></svg>Ajustes</a>
    </nav>
    <button class="logout" id="btn-logout" type="button"><svg viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg>Salir</button>
  </div></aside>

  <div class="content">
    <div class="top">
      <div class="tl">
        <button class="navtoggle" id="navToggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Ocultar panel lateral" title="Ocultar panel lateral"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        <span class="minibrand"><svg class="mark" viewBox="380 355 1210 1200" aria-hidden="true"><path class="m3" d="M390 752C385 590 500 465 665 465H1200L900 752Z"/><path class="m2" d="M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1550 640 1440 750 1300 752H1240C1170 760 1125 810 1120 880V1250C1120 1420 1000 1540 860 1540Z"/><path class="m1" d="M572 1540V1420C572 1100 650 880 790 750C900 630 1010 540 1145 465C1280 405 1420 368 1572 365C1578 420 1578 460 1575 500C1300 500 1000 640 880 860C770 1050 712 1250 710 1540Z"/></svg>IterTrack</span>
        <label class="search">
          <input id="q" type="search" placeholder="Buscar patente, chofer o ruta" aria-label="Buscar camiones">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </label>
      </div>
      <div class="pill">
        <button class="al" id="alertBtn" type="button">0 alertas</button>
        <svg class="bell" viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V8a6 6 0 0 0-6-6zm-2 18a2 2 0 0 0 4 0z"/></svg>
        <div class="avatar">FL</div>
      </div>
    </div>

    <div class="grid">
      <div class="col">
        <div class="card mapcard">
          <div class="card-h"><h3>Mapa en vivo</h3><span class="tag" id="liveTag">Actualizando</span></div>
          <div class="mapbox"><div id="map"></div></div>
        </div>
        <div class="bottom">
          <div class="card">
            <div class="card-h"><h3>Velocidad por camión</h3><span class="tag">Ahora</span></div>
            <div class="bars" id="bars"></div>
          </div>
          <div class="card">
            <h3>Resumen de flota</h3>
            <div class="donuts" id="donuts"></div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card listcard">
          <div class="seg" id="seg">
            <button type="button" data-v="all" aria-pressed="true">Toda la flota</button>
            <button type="button" data-v="alert" aria-pressed="false">Solo alertas</button>
          </div>
          <div class="chips" id="chips">
            <button class="chip" data-s="all" aria-pressed="true">Todos</button>
            <button class="chip" data-s="move" aria-pressed="false">En movimiento</button>
            <button class="chip" data-s="idle" aria-pressed="false">Detenidos</button>
            <button class="chip" data-s="stop" aria-pressed="false">Apagados</button>
          </div>
          <div class="sorts">
            <select id="sort" aria-label="Ordenar por">
              <option value="plate">Patente</option>
              <option value="speed">Velocidad</option>
              <option value="fuel">Combustible</option>
              <option value="updated">Última señal</option>
              <option value="driver">Chofer</option>
            </select>
            <select id="dir" aria-label="Dirección del orden">
              <option value="asc">Ascendente</option>
              <option value="desc">Descendente</option>
            </select>
          </div>
          <div class="count" id="count"></div>
          <ul id="list"></ul>
        </div>
        <div class="card" style="padding:14px"><div class="detail" id="detail"></div></div>
      </div>
    </div>
  </div>
</div>
<nav class="mobile-tabs" id="mobile-tabs" aria-label="Vistas móviles">
  <button type="button" data-mobile-view="panel" aria-pressed="false">Panel</button>
  <button type="button" data-mobile-view="fleet" aria-pressed="false">Flota</button>
  <button type="button" data-mobile-view="map" aria-pressed="true">Mapa</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script type="module" src="/static/js/map.js"></script>
<script type="module" src="/static/js/map-nav.js"></script>
</body>
</html>
