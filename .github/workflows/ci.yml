name: CI

on:
  push:
    branches: [main, experiment/http]
  pull_request:
    branches: [main, experiment/http]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # The Makefile targets invoke env/bin/python, so the runner needs the
      # same virtualenv layout the project uses locally.
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv env
          env/bin/pip install --upgrade pip
          env/bin/pip install -r requirements.txt

      - name: Syntax check
        run: make check

      - name: Run tests
        run: make test
